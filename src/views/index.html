<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111111'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial,sans-serif' font-size='18' font-weight='700' fill='white'%3EWA%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="stylesheet" type="text/css"
          href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.8.8/semantic.min.css">
    <link rel="stylesheet" href="{{ .AppBasePath }}/assets/app.css">
    <script src="{{ .AppBasePath }}/assets/vendor/jquery-3.1.1.min.js"></script>
    <script src="{{ .AppBasePath }}/assets/vendor/semantic.min.js"></script>
    <script src="{{ .AppBasePath }}/assets/vendor/vue.global.prod.js"></script>
    <script src="{{ .AppBasePath }}/assets/vendor/axios.min.js"></script>
    <title>WA 群预警工作台 {{ .AppVersion }}</title>
</head>
<body>
<div id="splash-screen">
    <div class="splash-mark">WA</div>
    <h2 class="splash-title">WA Alert</h2>
    <div class="ui active large inline loader splash-spinner"></div>
</div>

<div class="ui container" id="app" style="display: none;">
    <div class="main-header compact-header">
        <h1 class="ui header center aligned">
            <div class="title-container">
                <span class="product-mark">WA Alert</span>
                <span>群预警工作台</span>
                <div class="version-label">{{ .AppVersion }}</div>
            </div>
        </h1>
    </div>

    <alert-workbench></alert-workbench>
</div>

<script>
    window.TYPEGROUP = "@g.us";
    window.TYPEUSER = "@s.whatsapp.net";
    window.DEVICE_ID_HEADER = 'X-Device-Id';

    window.showErrorInfo = (message) => {
        $('body').toast({
            position: 'bottom right',
            title: '错误',
            message: String(message || '操作失败'),
            showProgress: 'bottom',
            classProgress: 'red'
        });
    };
    window.showSuccessInfo = (message) => {
        $('body').toast({
            position: 'bottom right',
            title: '成功',
            message: String(message || '操作成功'),
            showProgress: 'bottom',
            classProgress: 'green'
        });
    };

    const baseHost = `${window.location.protocol}//${window.location.hostname}${window.location.port ? ':' + window.location.port : ''}`;
    window.http = axios.create({
        baseURL: `${baseHost}{{ .AppBasePath }}`
    });
    {{ if isEnableBasicAuth .BasicAuthToken }}
    window.http.defaults.headers.common['Authorization'] = "{{ .BasicAuthToken }}";
    {{ end }}
</script>

<script type="module">
    import AlertWorkbench from "{{ .AppBasePath }}/components/AlertWorkbench.js?v=20260602-dingtalk-help";

    Vue.createApp({
        components: { AlertWorkbench },
        delimiters: ['[[', ']]'],
    }).mount('#app');
</script>
</body>
</html>
