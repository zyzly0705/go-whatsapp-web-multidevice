name: Build WA Sentinel

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

jobs:
  build:
    name: Build WA Sentinel macOS DMG and Windows binary
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Run tests
        working-directory: src
        run: go test ./...

      - name: Build local browser binaries
        working-directory: src
        run: ./scripts/build-local-browser.sh

      - name: Package macOS DMG installers
        working-directory: src
        run: ./scripts/package-macos-dmg.sh

      - name: Upload macOS and Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wa-sentinel-macos-windows
          path: |
            src/dist/wa-sentinel-macos-amd64.dmg
            src/dist/wa-sentinel-macos-arm64.dmg
            src/dist/wa-sentinel-windows-amd64.exe
          if-no-files-found: error
